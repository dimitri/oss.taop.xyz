baseURL = 'https://oss.theartofpostgresql.com/'
locale = 'en-us'
title = 'Open Source Software Maintenance'
theme = "oss"
publishDir = "docs"

[markup.goldmark]
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "Funded maintenance for the PostgreSQL tools you run in production — pgloader, pgcopydb, pg_auto_failover, and pgextwlist. Priority issue handling, defined SLAs, quarterly releases."
  # The <title> for the home page only. .Site.Title stays short because
  # it is also the suffix on every other page and the og:site_name; the
  # home page is the site's most valuable page and "Open Source Software
  # Maintenance" alone named neither the technology nor the products.
  home_title = 'PostgreSQL Tool Maintenance and Priority Support'
