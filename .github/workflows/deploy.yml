name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.162.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Build
        # baseURL must match the CNAME. It was oss.taop.xyz, a host that
        # does not resolve, so every absolute URL in the deployed build —
        # og:url, twitter:image, and all 10 sitemap entries — pointed at a
        # dead domain while the site itself served from
        # oss.theartofpostgresql.com. Leaving it to hugo.toml keeps the two
        # from drifting apart again.
        run: hugo --minify --gc
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
